[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# SPA: todas as rotas caem no index.html (React Router cuida do resto)
#
# O BLOG DEPENDE DESTA REGRA NÃO TER `force = true`. Sem `force`, o Netlify
# serve o arquivo que EXISTE antes de aplicar a regra ("shadowing"): o build
# grava dist/blog/index.html e dist/blog/<slug>/index.html (scripts/blog.mjs),
# e é esse HTML estático — completo, indexável sem JS — que sai para /blog/ e
# /blog/<slug>/. Com `force = true` todo artigo viraria o shell da SPA. O mesmo
# vale para /sitemap.xml e /blog/feed.xml, também gerados no build.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# ─── Headers de segurança ────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = """
      default-src 'self';
      script-src
        'self'
        https://www.clarity.ms
        https://scripts.clarity.ms;
      style-src
        'self'
        'unsafe-inline'
        https://fonts.googleapis.com;
      font-src
        'self'
        https://fonts.gstatic.com;
      img-src
        'self'
        data:
        blob:
        https://*.clarity.ms;
      connect-src
        'self'
        https://*.supabase.co
        wss://*.supabase.co
        https://fonts.googleapis.com
        https://fonts.gstatic.com
        https://www.clarity.ms
        https://*.clarity.ms;
      media-src
        'self'
        blob:;
      object-src 'none';
      base-uri 'self';
      form-action 'self';
      frame-ancestors 'none';
      upgrade-insecure-requests;
    """
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(self), microphone=(self), geolocation=(), payment=(), usb=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Cross-Origin-Opener-Policy = "same-origin"