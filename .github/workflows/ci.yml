# ASCENDE — Integração contínua (plano §6.3)
# Toda alteração enviada ao repositório executa: instalação limpa,
# TypeScript, lint, testes, build e verificação de higiene do repositório
# (nada de node_modules/.env/.DS_Store versionados).
#
# As EDGE FUNCTIONS rodam em Deno, não em Node: `tsc -b` e o vitest não as
# enxergam. Até 03/09/2026 todo o backend de IA (memória, captura, cobrança,
# WhatsApp) ia para produção sem nenhuma verificação automática — os passos
# de Deno abaixo fecham esse buraco.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalação limpa
        run: npm ci

      - name: TypeScript
        run: npx tsc -b

      - name: Lint
        run: npm run lint

      - name: Testes
        run: npm test

      # ─── Edge functions (Deno) ───────────────────────────────────────
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: TypeScript das edge functions
        run: deno check supabase/functions/*/index.ts supabase/functions/_shared/*.ts

      # Cobre a garantia central da Fase 2: a IA não sobrescreve memória
      # confirmada pela pessoa. Verificado por mutação — removendo a guarda
      # em persistMemories, dois testes deste arquivo falham.
      - name: Testes das edge functions
        run: deno test --allow-env --allow-net --allow-read supabase/functions/

      - name: Build
        run: npm run build

      - name: Higiene do repositório
        run: |
          set -e
          for path in node_modules .env .DS_Store dist; do
            if git ls-files --error-unmatch "$path" > /dev/null 2>&1; then
              echo "::error::'$path' está versionado — remova do repositório (git rm -r --cached $path)."
              exit 1
            fi
          done
          # .DS_Store em qualquer subpasta
          if git ls-files | grep -q "\.DS_Store$"; then
            echo "::error::Arquivos .DS_Store versionados — remova-os."
            exit 1
          fi

      - name: Verificação do setup.sql (sintaxe básica)
        run: |
          # Garante que o arquivo de banco não ficou com marcadores de conflito
          ! grep -nE '^(<<<<<<<|=======|>>>>>>>)' supabase/setup.sql
