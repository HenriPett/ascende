<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#FDFBF7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0D0D0F" media="(prefers-color-scheme: dark)" />
    <title>Ascende — O app que vê a sua vida inteira</title>
    <meta name="description" content="Seu app de dieta não sabe quanto você ganha. O Ascende vê corpo, dinheiro, alimentação e mente juntos e monta o plano que cabe no seu orçamento." />
    <link rel="canonical" href="https://ascende.site/" />

    <!-- Compartilhamento social (WhatsApp, X, etc.) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Ascende" />
    <meta property="og:url" content="https://ascende.site/" />
    <meta property="og:title" content="Ascende — O app que vê a sua vida inteira" />
    <meta property="og:description" content="Seu app de dieta não sabe quanto você ganha. O Ascende vê corpo, dinheiro, alimentação e mente juntos — e monta o plano que cabe no seu orçamento. Você conta o dia numa frase; ele registra o resto." />
    <meta property="og:image" content="https://ascende.site/icon-512.png" />
    <meta property="og:image:alt" content="Ascende — o app que vê a sua vida inteira" />
    <meta property="og:locale" content="pt_BR" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Ascende — O app que vê a sua vida inteira" />
    <meta name="twitter:description" content="O único app que vê a sua vida inteira: corpo, dinheiro, alimentação e mente no mesmo lugar." />
    <meta name="twitter:image" content="https://ascende.site/icon-512.png" />

    <!-- PWA / Adicionar à Tela de Início -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Ascende" />

    <!-- Sem Google Fonts, de propósito: a mesma regra da telemetria, abaixo.
         Uma requisição de fonte em toda abertura entregaria IP e horário de
         cada uso — inclusive das telas de finanças, saúde e diário. O corpo
         usa a fonte do sistema e a Sora vem do próprio app (src/main.tsx). -->

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Ascende",
        "url": "https://ascende.site/",
        "description": "O único app que vê a sua vida inteira: corpo, dinheiro, alimentação e mente no mesmo lugar, com uma IA que conecta os pontos.",
        "applicationCategory": "LifestyleApplication",
        "operatingSystem": "Web, iOS (PWA)",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "BRL"
        },
        "publisher": { "@id": "https://ascende.site/#organization" }
      }
    </script>
    <!-- Quem publica o Ascende. O endereço é a sede publicada na Política de
         Privacidade (src/lib/legal.ts, "Identificação da Controladora") — muda
         lá, muda aqui; o teste src/prerender/prerender.test.ts confere. Sem
         contactPoint: não há e-mail nem telefone público de atendimento (o
         canal é o feedback dentro do app), e inventar um seria pior que não
         ter. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "@id": "https://ascende.site/#organization",
        "name": "Ascende",
        "url": "https://ascende.site/",
        "logo": "https://ascende.site/icon-512.png",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "Rua Angelo Torinelli, 53, Sala 01, Vila Nova",
          "addressLocality": "Jaraguá do Sul",
          "addressRegion": "SC",
          "postalCode": "89259-200",
          "addressCountry": "BR"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- A telemetria NÃO é carregada aqui de propósito: isso a colocaria em
         toda a aplicação, inclusive nas telas de finanças, saúde, diário e
         conversas. Quem decide carregar é src/lib/analytics.ts, e só nas
         páginas públicas. -->

  </body>
</html>
